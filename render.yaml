# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: nota-de-banca-web
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: false
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: disabled
      - key: JOB_EXECUTOR
        value: queue
      - key: QUEUE_PREFIX
        value: nota-de-banca
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: RATE_LIMIT_PROVIDER
        value: redis
      - key: STORAGE_PROVIDER
        value: s3
      - key: DATABASE_URL
        fromDatabase:
          name: nota-de-banca-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: nota-de-banca-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nota-de-banca-redis
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: MONITOR_CRON_SECRET
        sync: false
      - key: CATALOG_SYNC_SECRET
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        sync: false
      - key: STORAGE_PREFIX
        sync: false
      - key: APP_VERSION
        sync: false

  - type: worker
    name: nota-de-banca-worker
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeploy: false
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    dockerCommand: node dist/worker/index.js
    preDeployCommand: npx prisma migrate deploy
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: disabled
      - key: JOB_EXECUTOR
        value: queue
      - key: QUEUE_PREFIX
        value: nota-de-banca
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: RATE_LIMIT_PROVIDER
        value: redis
      - key: STORAGE_PROVIDER
        value: s3
      - key: DATABASE_URL
        fromDatabase:
          name: nota-de-banca-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: nota-de-banca-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nota-de-banca-redis
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: MONITOR_CRON_SECRET
        sync: false
      - key: CATALOG_SYNC_SECRET
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        sync: false
      - key: STORAGE_PREFIX
        sync: false
      - key: APP_VERSION
        sync: false

  - type: keyvalue
    name: nota-de-banca-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: "off"

databases:
  - name: nota-de-banca-postgres
    plan: free
    region: oregon
    databaseName: nota_de_banca
    postgresMajorVersion: "16"
    ipAllowList: []
